name: rebuild-manifest

# 任何人改完 translations/ 下的文本，CI 会自动重算 manifest 并提交，
# 维护者不需要、也不应该手写 MD5。
on:
  push:
    branches: [main]
    paths:
      - "translations/**"
      - "tools/**"
      - ".github/workflows/manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild manifest
        run: python tools/build_manifest.py --root .

      - name: Verify every hash
        run: python tools/build_manifest.py --root . --verify

      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- translations/manifest/zh_Hans.json; then
            echo "manifest already up to date"
            exit 0
          fi
          git config user.name "abyss-manifest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/manifest/zh_Hans.json
          git commit -m "chore(manifest): regenerate hashes"
          git push
